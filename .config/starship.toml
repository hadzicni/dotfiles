"$schema" = "https://starship.rs/config-schema.json"

palette = "graphite"
add_newline = true

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$python\
$jobs\
$line_break\
$character"""

right_format = "$status$cmd_duration$time"

[os]
disabled = false
format = "[$symbol ]($style)"
style = "gray"

[os.symbols]
Macos = "\uf179"
Ubuntu = "\uf31b"
Debian = "\uf306"
Arch = "\uf303"
Linux = "\uf17c"

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold light"
style_root = "bold red"

[hostname]
ssh_only = false
format = "[@](gray)[$hostname]($style) "
style = "bold light"
trim_at = "."

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only = " \uf023"
read_only_style = "red"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "\ue0a0 "
format = "[$symbol$branch]($style) "
style = "bold orange"

[git_state]
format = "([$state( $progress_current/$progress_total)]($style) )"
style = "bold yellow"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[git_metrics]
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "green"
deleted_style = "red"

[python]
format = "([\ue73c $virtualenv]($style) )"
style = "yellow"
detect_extensions = []
detect_files = []
detect_folders = []

[jobs]
format = "[$symbol$number]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"

[status]
disabled = false
format = "[✘ $status]($style) "
style = "bold red"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "gray"

[palettes.graphite]
light = "#e6e6e6"
gray = "#8b949e"
cyan = "#5cb8e6"
orange = "#ff9d4d"
yellow = "#e0af68"
green = "#3fb950"
red = "#ff5f56"
